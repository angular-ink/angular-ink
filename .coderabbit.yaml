# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request. It requests changes on what it finds and approves once
# its comments are resolved. The rules it reviews against are in AGENTS.md, which it reads.
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ['main']
  path_filters:
    - '!package-lock.json'
    - '!e2e/expected/**'
    - '!docs/parity.md'
  path_instructions:
    - path: 'projects/core/src/lib/engine/**'
      instructions: >-
        Pure stages over readonly data: no mutation of inputs, no module-level state, no I/O, no
        painting during layout and no layout during the write. Parsers must stay linear (no
        super-linear regex). Flag missing tests.
    - path: 'projects/core/src/lib/{tree,elements,runtime,input,platform}/**'
      instructions: >-
        Angular 22: signals, input(), inject(), zoneless, no explicit standalone or OnPush. The
        only private Angular symbol is the one in platform/angular-private.ts. No React and no Ink
        code. Errors start with "angular-ink:". Input limits drop the excess and never throw.
    - path: '.github/workflows/**'
      instructions: >-
        Least privilege permissions, actions pinned to a full SHA with the version in a comment,
        timeout-minutes on every job, no pull_request_target, no secrets in jobs that run fork
        code.
    - path: '.changeset/*.md'
      instructions: >-
        A changeset is the CHANGELOG entry users read. It says what changed for them and why, in
        plain English, not how the code changed.
chat:
  auto_reply: true
