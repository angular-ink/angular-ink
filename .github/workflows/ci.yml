name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # No dependency needs an install script (prebuilt binaries ship as optional packages),
      # so there is no `npm rebuild` step. Add one here, naming the package, if that changes.
      - run: npm run format:check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The testing library's typed lint resolves @angular-ink/core from dist/core when it exists.
      - run: npm run build:core
      - run: npm run lint
      # The package READMEs' usage sections must match the repository README's.
      - run: node scripts/check-readme.mjs

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # build.spec packs dist/core, so build it first: a stale dist/core would test old code.
      - run: npm run build:core
      - run: npm run test:coverage

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Advisory: npm audit cannot read the ignore list in osv-scanner.toml, so OSV-Scanner below
      # is the gating scanner. A finding here still shows in the job log and the PR checks.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # An ignore in osv-scanner.toml needs a reason and an ignoreUntil at most 90 days ahead.
      - run: node scripts/check-osv-ignores.mjs
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  startup-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Builds the core and the CLI, bundles a hello app on the packed core, and fails above 150 ms
      # median startup, above 1 MB, or with @angular/compiler in the bundle.
      - run: node scripts/startup-budget.mjs

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: npm run build:testing
      - run: npm run build:cli
      # Fails when the files npm would publish include a spec, bench or test helper, or lack a
      # LICENSE, a README or the package's entry files.
      - run: node scripts/check-pack.mjs

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Builds the three demo apps on the packed core, runs them in real pseudo-terminals and
      # compares their screens with e2e/expected/*.txt.
      - run: node scripts/e2e.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-out
          path: out-tsc
          if-no-files-found: ignore

  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Runs the same apps on Ink 8.0.0 and on angular-ink and compares the screens cell by cell.
      # Exits 1 on a difference that parity/README.md does not list.
      - run: node parity/run.mjs

  # The packed tarballs as users get them from npm: installs the three into an empty folder, builds
  # a hello app with `angular-ink build` and checks what it prints. On the lowest Node major the
  # CLI supports and on the one the other jobs use, with the repository's Angular, and once with the
  # lowest @angular/core the peer range allows, since the core reads a private Angular export.
  pack-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24]
        angular: ['']
        include:
          - node-version: 22
            angular: 22.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - run: npm run build:testing
      - run: npm run build:cli
      - run: node scripts/pack-install.mjs ${ANGULAR:+--angular "$ANGULAR"}
        env:
          ANGULAR: ${{ matrix.angular }}
